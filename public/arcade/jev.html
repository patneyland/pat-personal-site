<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Jev / Snake</title>
  <link rel="icon" href="/arcade/icon.svg">
  <link rel="stylesheet" href="/arcade/jev.css">
</head>
<body>
  <header class="topbar"><a href="/arcade">↖ ARCADE</a><span>JEV <span class="muted">/</span> SNAKE</span><button id="fullscreen" aria-label="Toggle fullscreen">⛶</button></header>
  <main>
    <section class="game" aria-label="Snake game">
      <div class="scorebar"><div><span class="label">SCORE</span><strong id="score">0000</strong></div><div><span class="label">JEV BEST · THIS BROWSER</span><strong id="best">0000</strong></div><span class="mode">LIVE · ONE MOVE PER DECISION</span></div>
      <div class="glass"><div id="board"></div><div id="overlay"><span id="overlay-title">JEV</span><span id="overlay-note">SNAKE</span></div></div>
      <footer class="controls"><button id="start" disabled>START JEV</button><button id="pause" disabled>PAUSE</button><button id="restart" disabled>RESTART</button><button id="mute" aria-pressed="true" aria-label="Toggle sound">SOUND OFF</button></footer>
    </section>
    <aside class="console" aria-label="Jev command log">
      <div class="console-head"><span class="lamp" id="lamp"></span><h1>JEV</h1><span id="status" role="status">CONNECTING</span></div>
      <div class="keyboard" role="img" aria-label="Jev direction keys; no move yet">
        <div class="key up" data-dir="up"><span>↑</span><small>UP</small></div>
        <div class="key left" data-dir="left"><span>←</span><small>LEFT</small></div>
        <div class="key down" data-dir="down"><span>↓</span><small>DOWN</small></div>
        <div class="key right" data-dir="right"><span>→</span><small>RIGHT</small></div>
      </div>
      <div class="telemetry"><div><span class="label">MOVES</span><b id="moves">0</b></div><div><span class="label">RESPONSE</span><b id="latency">···</b></div><div><span class="label">CONFIDENCE</span><b id="confidence">···</b></div></div>
      <div class="log-heading"><span>COMMAND LOG</span><button id="export" disabled aria-label="Download full command log">↓ SAVE</button></div>
      <div class="log" tabindex="0" aria-label="Command history, newest first"><div id="empty">NO COMMANDS YET</div><ol id="commands"></ol></div>
      <div class="console-foot"><span id="model">JEV</span><span id="run">RUN 00</span></div>
    </aside>
  </main>
  <p id="notice" role="status"></p>
  <script src="/arcade/sound.js"></script>
  <script src="/arcade/net.js"></script>
  <script src="/arcade/snake.js"></script>
  <script src="/arcade/jev.js"></script>
</body>
</html>
