<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 76 152.7" width="76" height="152.7">
  <!--
    Traced from Patrick's pencil drawing, the two figures on one sheet. Every
    stroke is drawn once except the left arm, which keeps a copy of each pose.
    Swapping those two on a hold is the whole animation, the way a two frame
    hand drawn loop works. No tweening, on purpose.

    Two things here are load bearing, and both exist so he lands correctly at
    any window width. Read the matching note in globals.css before changing
    either.

    1. The viewBox bottom edge sits exactly on the soles (lowest ink is y
       152.7, counting half the stroke width). So wherever CSS puts the bottom
       of this image is where he is standing, at every size. Do not pad it.

    2. The arm is rotated 32 degrees off the drawn pose. On the page the link
       sits beside him and a shade below his shoulder, so an arm raised the way
       he drew it points over the top of it. Rotating the group aims it at the
       link while keeping his own line: the bend, the lengths, the wobble.
  -->
  <style>
    .ink {
      fill: none;
      stroke: #1a1a1a;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #arm-up, #arm-out { animation: 0.8s steps(1, end) infinite; }
    #arm-up  { animation-name: frame-a; }
    #arm-out { animation-name: frame-b; }

    @keyframes frame-a { 0% { opacity: 1 } 45%, 100% { opacity: 0 } }
    @keyframes frame-b { 0% { opacity: 0 } 45%, 100% { opacity: 1 } }

    /* Hold the extended point for anyone who does not want motion. */
    @media (prefers-reduced-motion: reduce) {
      #arm-up  { animation: none; opacity: 0 }
      #arm-out { animation: none; opacity: 1 }
    }
  </style>

  <g class="ink" stroke-width="1.8">
    <path d="M22.7 16.1 19.2 12.6" />
    <path d="M25.7 11.8 23.6 6.5" />
    <path d="M29.8 8.9 29.6 2.4" />
    <path d="M34.6 7.7 36.6 1.0" />
    <path d="M39.5 8.5 43.7 1.8" />
    <path d="M43.8 11.1 50.0 5.5" />
    <path d="M46.6 14.5 54.1 10.3" />
  </g>

  <path class="ink" stroke-width="2.5"
        d="M34.6 7.6C42.0 8.0 48.6 15.0 49.0 23.4 49.4 32.0 43.2 39.8 35.2 39.6 27.0 39.4 21.2 32.6 21.0 23.8 20.8 15.2 27.2 7.2 34.6 7.6Z" />

  <g class="ink" stroke-width="2.1">
    <path d="M30.0 15.9 30.4 18.8" />
    <path d="M40.0 14.7 40.4 17.6" />
    <path d="M24.6 25.4Q34.6 41.8 43.2 24.4" />
  </g>

  <g class="ink" stroke-width="2.2">
    <path d="M33.3 39.7Q34.2 75.0 37.1 110.6" />
    <path d="M35.0 73.0Q49.0 72.5 62.7 68.4" />
    <path d="M37.1 110.6Q30.0 132.0 21.8 151.6" />
    <path d="M37.1 110.6Q46.0 132.0 60.2 150.5" />

    <!-- Rotated about the shoulder joint at 35 73. -->
    <g transform="rotate(-32 35 73)">
      <path id="arm-up"  d="M35.0 73.6Q25.8 75.8 16.6 76.5L2.6 56.4" />
      <path id="arm-out" d="M35.0 72.6Q26.0 71.0 16.8 68.6L-5.6 53.0" />
    </g>
  </g>
</svg>
